        const scores = [10,20,30,40];
        const students = [
            {id:1,name:"Kim",score:90},

            {id:3,name:"Park",score:95}

        scores.forEach( s => console.log(s));

        const names = students.map(s => s.name);

        console.log(students.find(s => s.name === "Lee"));

        console.log(students.filter(s => s.score >= 90));

        console.log(students.filter(s => s.id !== 1));
